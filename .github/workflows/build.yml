name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          for bin_dir in "$SDK_DIR"/cmdline-tools/*/bin "$SDK_DIR"/platform-tools "$SDK_DIR"/tools/bin; do
            if [ -d "$bin_dir" ]; then
              export PATH="$bin_dir:$PATH"
            fi
          done
          echo "$PATH" >> $GITHUB_PATH
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --sdk_root="$SDK_DIR" --licenses || true
            sdkmanager --sdk_root="$SDK_DIR" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-APK
          path: app/build/outputs/apk/debug/app-debug.apk
